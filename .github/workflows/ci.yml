name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-integration:
    name: Isolated NFQUEUE and TLS decoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vigilante-integration -f deploy/test/Dockerfile .
      - run: docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW vigilante-integration
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test Caddy module
        working-directory: pkg/caddy
        run: go test ./...

  detector-eval:
    name: Detector eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Fails when recall drops below 85% or false positives exceed 5% on the
      # labelled corpus, so a detector change cannot silently regress.
      - name: Eval
        run: ./scripts/ci-eval.sh
