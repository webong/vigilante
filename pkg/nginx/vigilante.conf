# Vigilante for nginx — auth_request + mirror
#
# Run the sidecar next to nginx:
#
#   vigilante -mode sidecar \
#     -sidecar-listen 127.0.0.1:9090 \
#     -target http://app:3000 \
#     -policy /etc/vigilante/policy.yaml \
#     -alert-file /var/log/vigilante/alerts.jsonl
#
# Then include the location blocks below in your `server { ... }`.
# Requires ngx_http_auth_request_module (standard in most distributions).

upstream vigilante_sidecar {
    server 127.0.0.1:9090;
    keepalive 16;
}

# 1. Decision subrequest. 204 = allow, 403 = deny/block.
#    auth_request only consumes the status code.
location = /_vigilante_check {
    internal;
    proxy_pass http://vigilante_sidecar/v1/check;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. Mirror subrequest: a fire-and-forget copy for agent triage.
#    The original response is never delayed by the sidecar.
location = /_vigilante_mirror {
    internal;
    proxy_pass http://vigilante_sidecar/v1/observe;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. Apply to your application location.
location / {
    auth_request /_vigilante_check;

    mirror /_vigilante_mirror;
    mirror_request_body on;

    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
